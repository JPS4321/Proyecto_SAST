sonar.projectKey=Prueba-CRM
sonar.projectName=secure-crm
sonar.projectVersion=fase2

sonar.sources=apps,packages,docs
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.next/**,**/.turbo/**,**/.scannerwork/**,**/*.test.ts,**/*.spec.ts,**/pnpm-lock.yaml,apps/*/test/**

# Pruebas (Vitest): se analizan como código de prueba, no como código de producción.
sonar.tests=apps/api/test,apps/web/test

# Cobertura generada con `pnpm test:coverage` (Vitest + V8). Las rutas dentro de cada
# lcov.info son relativas a la raíz del proyecto (apps/<paquete>/...).
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info

# Solo se excluye de la medición de cobertura la configuración del propio runner de pruebas
# y las declaraciones de tipos (sin código ejecutable). Ningún archivo de producción.
sonar.coverage.exclusions=**/vitest.config.mts,**/*.d.ts

# Importar los hallazgos de Semgrep mediante SARIF
sonar.sarifReportPaths=semgrep.sarif