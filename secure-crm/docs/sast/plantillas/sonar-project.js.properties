# Proyecto JavaScript / TypeScript
# Copia este archivo a la raíz de tu proyecto con el nombre: sonar-project.properties
# ⚠️ NO pongas el token aquí: se pasa con -Dsonar.token=$SONAR_TOKEN

sonar.projectKey=CAMBIAR-por-tu-project-key
sonar.projectVersion=fase1
sonar.host.url=http://localhost:9000

# Código a analizar (puede ser "src" si todo tu código está ahí)
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/reports-dc/**,**/*.test.*,**/*.spec.*,semgrep.sarif

# Paso 6 · Semgrep (descomenta cuando generes el reporte)
# sonar.sarifReportPaths=semgrep.sarif

# Paso 7 · Dependency-Check (opcional)
# sonar.dependencyCheck.jsonReportPath=reports-dc/dependency-check-report.json
# sonar.dependencyCheck.htmlReportPath=reports-dc/dependency-check-report.html

# Paso 10 · Cobertura (Fase 2)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
