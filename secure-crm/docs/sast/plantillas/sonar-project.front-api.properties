# Front + API en el mismo repositorio (un solo proyecto de SonarQube)
# Secure CRM: la web está en apps/web y la API en apps/api/src.
# Otro monorepo: sustituye esas carpetas.
# Copia este archivo a la raíz del repositorio con el nombre: sonar-project.properties
# ⚠️ NO pongas el token aquí: se pasa con -Dsonar.token=$SONAR_TOKEN

sonar.projectKey=CAMBIAR-por-tu-project-key
sonar.projectVersion=fase1
sonar.host.url=http://localhost:9000

sonar.sources=apps/web,apps/api/src
sonar.exclusions=**/node_modules/**,**/.next/**,**/build/**,**/dist/**,**/coverage/**,**/reports-dc/**,**/*.test.*,**/*.spec.*,semgrep.sarif

# Paso 6 · Semgrep
# sonar.sarifReportPaths=semgrep.sarif

# Paso 7 · Dependency-Check (opcional): un reporte por carpeta, separados por coma
# sonar.dependencyCheck.jsonReportPath=reports-dc/dependency-check-report.json
# sonar.dependencyCheck.htmlReportPath=reports-dc/dependency-check-report.html

# Paso 10 · Cobertura de ambos componentes
# sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/api/coverage/lcov.info
